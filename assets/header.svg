  <title id="t">Mérouane. Systèmes, réseaux, cybersécurité.</title>
  <desc id="d">Le nom Mérouane en LED sur une grille, et la commande tapée : comprendre, tester, construire.</desc>
  <style>
    .s { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #c9d1d9; }
    .muted { fill-opacity: .7; }
    .cover { transform: scaleX(0); transform-origin: 925.6px 0; }
    .band { opacity: 0; }
    @keyframes wave { 0% { opacity: .75; } 5% { opacity: 1; } 14%, 100% { opacity: .75; } }
    @keyframes band {
      0% { opacity: 0; transform: translateX(0); }
      3% { opacity: .55; }
      58.75% { opacity: .55; transform: translateX(846px); }
      62%, 100% { opacity: 0; transform: translateX(846px); }
    }
    @keyframes reveal {
      0% { transform: scaleX(1); animation-timing-function: steps(34, end); }
      50%, 100% { transform: scaleX(0); }
    }
    @keyframes caret {
      0% { transform: translateX(-326.4px); animation-timing-function: steps(34, end); }
      50%, 100% { transform: translateX(0); }
    }
    @keyframes blink {
      0%, 12.4%, 25%, 37.4%, 50%, 62.4%, 75%, 87.4%, 100% { opacity: 1; }
      12.5%, 24.9%, 37.5%, 49.9%, 62.5%, 74.9%, 87.5%, 99.9% { opacity: 0; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .col { animation: wave 8s linear infinite backwards; }
      .band { animation: band 8s linear infinite; }
      .cover { animation: reveal 8s infinite; }
      .caret { animation: caret 8s infinite, blink 4s linear infinite; }
    }
  </style>
