<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Mérouane, systèmes, réseaux et cybersécurité">
<style>
.link{fill:none;stroke:#2c353d;stroke-width:2}
.packet{fill:none;stroke:#6fdc9b;stroke-width:9;stroke-linecap:round;stroke-dasharray:.01 200;opacity:0;animation:pass 12s linear infinite}
.drop{stroke:#e5a84b;animation-name:drop}
.led{fill:#3a454e;animation:ack 12s linear infinite}
.fw{animation-name:deny}
.note{opacity:0;animation:note 12s linear infinite}
.d0{animation-delay:0s}.d3{animation-delay:3s}.d6{animation-delay:6s}.d9{animation-delay:9s}
.type{animation:type 2.8s steps(35) .6s forwards}
.caret{animation:hide .01s linear 3.8s forwards}
@keyframes pass{0%{stroke-dashoffset:0;opacity:1}20%{stroke-dashoffset:-100;opacity:1}20.1%,100%{stroke-dashoffset:-100;opacity:0}}
@keyframes drop{0%{stroke-dashoffset:0;opacity:1}7%{stroke-dashoffset:-100;opacity:1}7.1%,100%{stroke-dashoffset:-100;opacity:0}}
@keyframes ack{0%,19%{fill:#3a454e}21%,33%{fill:#6fdc9b}42%,100%{fill:#3a454e}}
@keyframes deny{0%,6%{fill:#3a454e}8%,20%{fill:#e5a84b}28%,100%{fill:#3a454e}}
@keyframes note{0%,6%{opacity:0}8%,20%{opacity:1}28%,100%{opacity:0}}
@keyframes type{to{transform:translateX(462px)}}
@keyframes hide{to{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.led{fill:#6fdc9b}.type{transform:translateX(462px)}.caret{opacity:0}}
</style>
<rect width="1200" height="420" rx="16" fill="#12171c"/>
<defs><clipPath id="round"><circle cx="122" cy="110" r="66"/></clipPath></defs>
<image x="56" y="44" width="132" height="132" clip-path="url(#round)" href="data:image/jpeg;base64,"/>
<text x="56" y="252" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="500" fill="#e8eaec">Mérouane</text>
<text x="56" y="298" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="27" fill="#9aa4ad">Systèmes, réseaux, cybersécurité</text>
<text x="56" y="358" font-family="'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="22" fill="#6fdc9b" textLength="462" lengthAdjust="spacingAndGlyphs">$ comprendre &amp;&amp; tester &amp;&amp; construire</text>
<g class="type"><rect x="54" y="336" width="480" height="32" fill="#12171c"/><rect class="caret" x="55" y="340" width="11" height="24" fill="#6fdc9b"/></g>
<path class="link" d="M610 210 H960 V100 H1040"/><path class="link" d="M610 210 H1040"/><path class="link" d="M610 210 H960 V320 H1040"/>
<path class="packet d0" pathLength="100" d="M610 210 H960 V100 H1040"/>
<path class="packet drop d3" pathLength="100" d="M610 210 H694"/>
<path class="packet d6" pathLength="100" d="M610 210 H1040"/>
<path class="packet d9" pathLength="100" d="M610 210 H960 V320 H1040"/>
<circle cx="600" cy="210" r="10" fill="none" stroke="#6b7680" stroke-width="2"/>
<text x="600" y="250" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#9aa4ad">Internet</text>
<rect x="694" y="180" width="124" height="60" rx="10" fill="#1a2127" stroke="#2c353d" stroke-width="1.5"/><circle class="led fw d3" cx="712" cy="210.0" r="5"/><text x="726" y="217.0" text-anchor="start" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#e8eaec">pfSense</text>
<text class="note d3" x="756" y="164" text-anchor="middle" font-family="'Cascadia Code', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="18" fill="#e5a84b">bloqué</text>
<rect x="860" y="180" width="100" height="60" rx="10" fill="#1a2127" stroke="#2c353d" stroke-width="1.5"/><text x="910.0" y="217.0" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#e8eaec">Switch</text>
<rect x="1040" y="70" width="124" height="60" rx="10" fill="#1a2127" stroke="#2c353d" stroke-width="1.5"/><circle class="led d0" cx="1058" cy="100.0" r="5"/><text x="1072" y="107.0" text-anchor="start" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#e8eaec">VLAN</text>
<rect x="1040" y="180" width="124" height="60" rx="10" fill="#1a2127" stroke="#2c353d" stroke-width="1.5"/><circle class="led d6" cx="1058" cy="210.0" r="5"/><text x="1072" y="217.0" text-anchor="start" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#e8eaec">AD</text>
<rect x="1040" y="290" width="124" height="60" rx="10" fill="#1a2127" stroke="#2c353d" stroke-width="1.5"/><circle class="led d9" cx="1058" cy="320.0" r="5"/><text x="1072" y="327.0" text-anchor="start" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#e8eaec">GLPI</text>
</svg>
