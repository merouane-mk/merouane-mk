  <desc id="d">Sujet : Mérouane. Compte : @merouane-mk. Domaines : Systèmes, réseaux, cybersécurité. Approche : J’apprends l’infra en la construisant. Lab : Windows Server, Active Directory, GLPI, pfSense. Contact : merouane.karki@gmail.com.</desc>
