      0% { opacity: 0; transform: translateY(0); }
      5% { opacity: 1; }
      70% { opacity: 1; transform: translateY(264px); }
      75%, 100% { opacity: 0; transform: translateY(264px); }
    }
    @keyframes row { 0% { opacity: .2; } 6%, 88% { opacity: 1; } 100% { opacity: .2; } }
    @media (prefers-reduced-motion: no-preference) {
      .sweep { animation: sweep 8s linear infinite; }
      .row { animation: row 8s linear infinite backwards; }
    }
  </style>
