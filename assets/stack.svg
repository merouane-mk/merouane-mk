<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" role="img" aria-labelledby="t d">
  <title id="t">Outils</title>
  <desc id="d">Systèmes et services : Windows Server, Active Directory, Ubuntu Server, DNS, DHCP. Réseaux : Cisco Packet Tracer, TCP/IP, VLAN, pfSense. Support et parc : GLPI, AnyDesk, TeamViewer. Programmation : Python, SQL, PowerShell. IA : Claude, Claude Code, OpenAI.</desc>
