<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">Mérouane. Systèmes, réseaux, cybersécurité.</title>
  <desc id="d">Commande tapée : comprendre, tester, construire. Schéma : Internet vers pfSense, qui bloque un paquet, puis un switch vers VLAN, AD et GLPI.</desc>
  <style>
    /* Sans animation (mouvement réduit), l'état par défaut est l'image finale complète. */
    .sans { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .label { font-size: 14px; fill: #c9d1d9; text-anchor: middle; }
    .node { fill: #0d1117; stroke: #3fb950; stroke-width: 1.5; }
    .pkt { opacity: 0; }
    .dot { transform-box: fill-box; transform-origin: center; }
    .cover { transform: scaleX(0); transform-origin: 385.6px 0; }

    @keyframes reveal {
      0% { transform: scaleX(1); animation-timing-function: steps(34, end); }
      50%, 100% { transform: scaleX(0); }
    }
    @keyframes caret {
      0% { transform: translateX(-326.4px); animation-timing-function: steps(34, end); }
      50%, 100% { transform: translateX(0); }
    }
    @keyframes blink {
      0%, 12.4%, 25%, 37.4%, 50%, 62.4%, 75%, 87.4%, 100% { opacity: 1; }
      12.5%, 24.9%, 37.5%, 49.9%, 62.5%, 74.9%, 87.5%, 99.9% { opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: .45; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.4); }
    }
    @keyframes bloque {
      0%, 24% { opacity: .25; }
      25%, 36% { opacity: 1; }
      37%, 44% { opacity: .25; }
      45%, 60% { opacity: 1; }
      61%, 100% { opacity: .25; }
    }
    @keyframes drop {
      0%, 14% { opacity: 0; transform: translate(528px, 150px); }
      15% { opacity: 1; }
      25% { opacity: 1; transform: translate(562px, 150px); }
      32%, 100% { opacity: 0; transform: translate(562px, 150px); }
    }
    /* Waypoints proportionnels à la distance, pour une vitesse constante. */
    @keyframes to-ad {
      0% { opacity: 0; transform: translate(528px, 150px); }
      1% { opacity: 1; }
      12.9% { transform: translate(654px, 150px); }
      25% { transform: translate(772px, 150px); }
      30.3% { opacity: 1; transform: translate(824px, 150px); }
      31.3%, 100% { opacity: 0; transform: translate(824px, 150px); }
    }
    @keyframes to-vlan {
      0% { opacity: 0; transform: translate(528px, 150px); }
      1% { opacity: 1; }
      12.9% { transform: translate(654px, 150px); }
      25% { transform: translate(772px, 150px); }
      27.7% { transform: translate(798px, 150px); }
      34.8% { transform: translate(798px, 80px); }
      37.5% { opacity: 1; transform: translate(824px, 80px); }
      38.5%, 100% { opacity: 0; transform: translate(824px, 80px); }
    }
    @keyframes to-glpi {
      0% { opacity: 0; transform: translate(528px, 150px); }
      1% { opacity: 1; }
      12.9% { transform: translate(654px, 150px); }
      25% { transform: translate(772px, 150px); }
      27.7% { transform: translate(798px, 150px); }
      34.8% { transform: translate(798px, 220px); }
      37.5% { opacity: 1; transform: translate(824px, 220px); }
      38.5%, 100% { opacity: 0; transform: translate(824px, 220px); }
    }

    @media (prefers-reduced-motion: no-preference) {
      .cover { animation: reveal 8s infinite; }
      .caret { animation: caret 8s infinite, blink 4s linear infinite; }
      .dot { animation: pulse 4s ease-in-out infinite; }
      .d2 { animation-delay: .6s; }
      .d3 { animation-delay: 1.2s; }
      .d4 { animation-delay: 1.8s; }
      .bloque { animation: bloque 4s linear infinite; }
      .p-drop { animation: drop 4s linear infinite; }
      .p-ad { animation: to-ad 8s linear infinite; }
      .p-vlan { animation: to-vlan 8s linear 2.6s infinite; }
      .p-glpi { animation: to-glpi 8s linear 5.2s infinite; }
    }
  </style>

  <rect x=".5" y=".5" width="959" height="299" rx="10" fill="#0d1117" stroke="#c9d1d9" stroke-opacity=".15"/>

  <text class="sans" x="40" y="112" font-size="56" font-weight="700">Mérouane</text>
  <text class="sans" x="40" y="152" font-size="20">Systèmes, réseaux, cybersécurité</text>

  <!-- textLength fixe la grille de caractères quelle que soit la police monospace du système. -->
  <text class="mono" x="40" y="210" font-size="16" fill="#3fb950" textLength="345.6">$ comprendre &amp;&amp; tester &amp;&amp; construire</text>
  <rect class="cover" x="59.2" y="192" width="326.4" height="26" fill="#0d1117"/>
  <rect class="caret" x="387" y="196" width="9" height="18" fill="#3fb950"/>

  <path d="M528 150H824M798 80V220M798 80H824M798 220H824" fill="none" stroke="#c9d1d9" stroke-opacity=".35" stroke-width="1.5"/>

  <!-- Les paquets passent sous les nœuds. -->
  <circle class="pkt p-ad" r="4" fill="#3fb950"/>
  <circle class="pkt p-vlan" r="4" fill="#3fb950"/>
  <circle class="pkt p-glpi" r="4" fill="#3fb950"/>
  <circle class="pkt p-drop" r="4" fill="#d29922"/>

  <g class="mono">
    <rect class="node" x="440" y="132" width="88" height="36" rx="6" style="stroke:#c9d1d9;stroke-opacity:.5"/>
    <text class="label" x="484" y="155">Internet</text>
    <rect class="node" x="566" y="132" width="88" height="36" rx="6" style="stroke:#d29922"/>
    <text class="label" x="610" y="155">pfSense</text>
    <text class="bloque" x="610" y="190" font-size="14" fill="#d29922" text-anchor="middle">bloqué</text>
    <rect class="node" x="692" y="132" width="80" height="36" rx="6"/>
    <text class="label" x="732" y="155">Switch</text>
    <rect class="node" x="824" y="62" width="96" height="36" rx="6"/>
    <text class="label" x="872" y="85">VLAN</text>
    <rect class="node" x="824" y="132" width="96" height="36" rx="6"/>
    <text class="label" x="872" y="155">AD</text>
    <rect class="node" x="824" y="202" width="96" height="36" rx="6"/>
    <text class="label" x="872" y="225">GLPI</text>
  </g>

  <circle class="dot" cx="528" cy="132" r="4" fill="#3fb950"/>
  <circle class="dot d2" cx="654" cy="132" r="4" fill="#d29922"/>
  <circle class="dot d3" cx="772" cy="132" r="4" fill="#3fb950"/>
  <circle class="dot d4" cx="920" cy="62" r="4" fill="#3fb950"/>
  <circle class="dot d4" cx="920" cy="132" r="4" fill="#3fb950"/>
  <circle class="dot d4" cx="920" cy="202" r="4" fill="#3fb950"/>
</svg>
